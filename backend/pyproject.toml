[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veriloop"
version = "0.1.0"
description = "VeriLoop - agentic fact verification + deepfake audit platform (hackathon prototype)"
requires-python = ">=3.12,<3.13"
readme = { text = "See docs/SPEC.md and docs/BUILD_SPEC.md in the repository root.", content-type = "text/plain" }
license = { text = "Proprietary (hackathon prototype)" }
dependencies = [
    # web / api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sse-starlette>=2.1",
    # infra
    "structlog>=24.1",
    "httpx>=0.27",
    "tenacity>=8.5",
    "pyyaml>=6.0",
    "cryptography>=43",
    # data
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pgserver>=0.1.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    # orchestration
    "langgraph>=0.2",
    # evidence / parsing
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "tldextract>=5.1",
    "rapidfuzz>=3.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "langdetect>=1.0.9",
    # media / ingestion
    "yt-dlp>=2024.8.6",
    "playwright>=1.45",
    "imagehash>=4.3",
    "pillow>=10.4",
    # reporting / audit
    "jinja2>=3.1",
    "reportlab>=4.2",
    "qrcode[pil]>=7.4",
    # bots
    "aiogram>=3.10",
]

[project.optional-dependencies]
# Local ML stack. Torch must come from the CPU index:
#   uv pip install -e "backend[ml,dev,c2pa]" --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "open_clip_torch>=2.26",
    "timm>=1.0",
    "faster-whisper>=1.0",
    "easyocr>=1.7",
    "opencv-python-headless>=4.10",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
]
# C2PA Content Credentials parsing (bonus forensic signal). Kept separate so a missing wheel
# never blocks the core install; forensic code must lazy-import `c2pa`.
c2pa = [
    "c2pa-python>=0.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
veriloop = "veriloop.main:main"

[tool.hatch.build.targets.wheel]
packages = ["veriloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m \"not network and not ml\" -p no:cacheprovider"
timeout = 120
markers = [
    "network: needs real network access (deselected by default)",
    "ml: downloads or runs real local ML models (deselected by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pgserver.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
# Contracts are pydantic models: list/dict defaults are copied per instance (RUF012 is a false
# positive), `str, Enum` keeps the wire format explicit, and __init__ re-exports via __all__.
"veriloop/contracts/*" = ["RUF012", "UP042", "UP017", "E501"]
"veriloop/contracts/__init__.py" = ["F401"]
